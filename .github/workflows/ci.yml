name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Repo hygiene
        run: python tools/check_repo_hygiene.py

      - name: Ruff
        run: python -m ruff check src tests tools apps examples

      - name: Mypy
        run: python -m mypy src

      - name: Meta gates
        run: python -m pytest tests/meta -q

      - name: Pytest non-live
        if: matrix.python-version != '3.14'
        run: python -m pytest -m "not live"

      - name: Pytest non-live with coverage
        if: matrix.python-version == '3.14'
        run: >-
          python -m pytest -m "not live"
          --cov=telecraft
          --cov-branch
          --cov-report=term-missing

      - name: Live collect-only
        run: python -m pytest tests/live --collect-only -q

  packaging:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install build "twine>=6"

      - name: Build distributions in isolation
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Check package artifact hygiene
        run: python tools/check_repo_hygiene.py --artifacts

      - name: Verify typed marker and installed wheel version
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          WHEEL="$wheel" python - <<'PY'
          import os
          from zipfile import ZipFile

          with ZipFile(os.environ["WHEEL"]) as archive:
              assert "telecraft/py.typed" in archive.namelist()
          PY
          python -m venv "$RUNNER_TEMP/telecraft-wheel-venv"
          "$RUNNER_TEMP/telecraft-wheel-venv/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/telecraft-wheel-venv/bin/telecraft" --help >/dev/null
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" \
            "$RUNNER_TEMP/telecraft-wheel-venv/bin/python" - <<'PY'
          import importlib.metadata
          import os

          import telecraft

          installed = importlib.metadata.version("telecraft")
          assert installed == os.environ["EXPECTED_VERSION"]
          assert telecraft.__version__ == installed
          scripts = {
              ep.name: ep.value
              for ep in importlib.metadata.distribution("telecraft").entry_points
              if ep.group == "console_scripts"
          }
          assert scripts.get("telecraft") == "telecraft.cli:main"
          PY
