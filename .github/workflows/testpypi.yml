name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      wheel_sha256: ${{ steps.artifact-digests.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.artifact-digests.outputs.sdist_sha256 }}

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI publishes must be dispatched from main." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Read package version
        id: package-version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install release tools
        run: python -m pip install -e ".[dev]" "hatchling>=1.25"

      - name: Verify live release evidence is bound to the candidate
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          case "$version" in
            *a*) release_type=alpha ;;
            *b*) release_type=beta ;;
            *rc*) release_type=rc ;;
            *) release_type=stable ;;
          esac
          evidence="release/evidence/${version}/release_manifest.json"
          test -f "$evidence"
          tested_commit="$(EVIDENCE="$evidence" python - <<'PY'
          import json
          import os

          with open(os.environ["EVIDENCE"], encoding="utf-8") as stream:
              print(json.load(stream)["tested_commit"])
          PY
          )"
          git cat-file -e "${tested_commit}^{commit}"
          head_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tested_commit" "$head_commit"
          mapfile -t evidence_changes < <(git diff --name-only "$tested_commit" "$head_commit")
          if [[ "${#evidence_changes[@]}" -ne 1 || "${evidence_changes[0]}" != "$evidence" ]]; then
            echo "Only the sanitized evidence manifest may differ from the live-tested commit." >&2
            printf '%s\n' "${evidence_changes[@]}" >&2
            exit 1
          fi
          python tools/release_check.py \
            --version "$version" \
            --release-type "$release_type" \
            --evidence-file "$evidence" \
            --write-dir "$RUNNER_TEMP/release-readiness" \
            --dry-run

      - name: Run release-quality gates
        run: |
          python tools/check_repo_hygiene.py
          python -m ruff check src tests tools apps examples
          python -m mypy src
          python -m pytest tests/meta -q
          python -m pytest -m "not live"
          python -m pytest tests/live --collect-only -q

      - name: Build and validate distributions
        id: artifact-digests
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          python -m build
          python -m twine check --strict dist/*
          python tools/check_repo_hygiene.py --artifacts
          mapfile -t distributions < <(find dist -maxdepth 1 -type f -print)
          if [[ "${#distributions[@]}" -ne 2 ]]; then
            echo "Expected exactly one wheel and one sdist; found ${#distributions[@]} files." >&2
            printf '%s\n' "${distributions[@]}" >&2
            exit 1
          fi
          wheel="dist/telecraft-${PACKAGE_VERSION}-py3-none-any.whl"
          sdist="dist/telecraft-${PACKAGE_VERSION}.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          echo "wheel_sha256=$(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum "$sdist" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/telecraft
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  smoke-test:
    name: Install from TestPyPI
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Download and install the TestPyPI artifact
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "hatchling>=1.25"
          mkdir -p "$RUNNER_TEMP/testpypi-download"
          downloaded=0
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest "$RUNNER_TEMP/testpypi-download" \
              "telecraft==${EXPECTED_VERSION}"; then
              downloaded=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$downloaded" -eq 1
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download \
              --no-cache-dir --no-deps --no-binary=:all: --no-build-isolation \
              --index-url https://test.pypi.org/simple/ \
              --dest "$RUNNER_TEMP/testpypi-download" \
              "telecraft==${EXPECTED_VERSION}"; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          wheel="$(find "$RUNNER_TEMP/testpypi-download" -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/testpypi-download" -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = "$EXPECTED_WHEEL_SHA256"
          test "$(sha256sum "$sdist" | cut -d' ' -f1)" = "$EXPECTED_SDIST_SHA256"
          python -m pip install --index-url https://pypi.org/simple/ "$wheel"
          python - <<'PY'
          import importlib.metadata
          import os

          import telecraft

          installed = importlib.metadata.version("telecraft")
          assert installed == os.environ["EXPECTED_VERSION"]
          assert telecraft.__version__ == installed
          PY
          {
            echo "### Approved TestPyPI candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Version: \`$EXPECTED_VERSION\`"
            echo "- Wheel SHA-256: \`$EXPECTED_WHEEL_SHA256\`"
            echo "- sdist SHA-256: \`$EXPECTED_SDIST_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
