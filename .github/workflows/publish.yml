name: Publish Python Package

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      tag_commit: ${{ steps.package-version.outputs.tag_commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify tag, package version, and main ancestry
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Release tag must be exactly v${version}; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Tagged commit must be contained in origin/main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Install release tools
        run: python -m pip install -e ".[dev]" "hatchling==1.26.3"

      - name: Verify live release evidence is bound to the candidate
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          case "$version" in
            *a*) release_type=alpha ;;
            *b*) release_type=beta ;;
            *rc*) release_type=rc ;;
            *) release_type=stable ;;
          esac
          evidence="release/evidence/${version}/release_manifest.json"
          test -f "$evidence"
          tested_commit="$(EVIDENCE="$evidence" python - <<'PY'
          import json
          import os

          with open(os.environ["EVIDENCE"], encoding="utf-8") as stream:
              print(json.load(stream)["tested_commit"])
          PY
          )"
          git cat-file -e "${tested_commit}^{commit}"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tested_commit" "$tag_commit"
          mapfile -t evidence_changes < <(git diff --name-only "$tested_commit" "$tag_commit")
          if [[ "${#evidence_changes[@]}" -ne 1 || "${evidence_changes[0]}" != "$evidence" ]]; then
            echo "Only the sanitized evidence manifest may differ from the live-tested commit." >&2
            printf '%s\n' "${evidence_changes[@]}" >&2
            exit 1
          fi
          python tools/release_check.py \
            --version "$version" \
            --release-type "$release_type" \
            --evidence-file "$evidence" \
            --write-dir "$RUNNER_TEMP/release-readiness" \
            --dry-run

      - name: Repo hygiene
        run: python tools/check_repo_hygiene.py

      - name: Repository history hygiene
        run: python tools/check_repo_hygiene.py --history

      - name: Credential scan
        run: |
          python tools/check_secrets.py
          python tools/check_secrets.py --history

      - name: Ruff
        run: python -m ruff check src tests tools apps examples

      - name: Ruff format
        run: python -m ruff format --check src tests tools apps examples

      - name: Mypy
        run: python -m mypy src

      - name: Audit project runtime dependencies
        run: python -m pip_audit --strict .

      - name: Meta gates
        run: python -m pytest tests/meta -q

      - name: Pytest non-live with coverage
        run: >-
          python -m pytest -m "not live"
          --cov=telecraft
          --cov-branch
          --cov-report=term-missing

      - name: Live collect-only
        run: python -m pytest tests/live --collect-only -q

      - name: Build distributions in isolation
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Check package artifact hygiene
        run: python tools/check_repo_hygiene.py --artifacts

      - name: Validate the exact distribution files
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t distribution_files < <(find dist -maxdepth 1 -type f -print)
          if [[ "${#distribution_files[@]}" -ne 2 ]]; then
            echo "Expected exactly one wheel and one sdist; found ${#distribution_files[@]} files." >&2
            printf '%s\n' "${distribution_files[@]}" >&2
            exit 1
          fi
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test -f "dist/telecraft-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "dist/telecraft-${PACKAGE_VERSION}.tar.gz"

      - name: Install and verify the tagged wheel in a clean environment
        env:
          EXPECTED_VERSION: ${{ steps.package-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/telecraft-release-venv"
          "$RUNNER_TEMP/telecraft-release-venv/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/telecraft-release-venv/bin/telecraft" --help >/dev/null
          "$RUNNER_TEMP/telecraft-release-venv/bin/python" - <<'PY'
          import importlib.metadata
          import os

          import telecraft

          installed = importlib.metadata.version("telecraft")
          assert installed == os.environ["EXPECTED_VERSION"]
          assert telecraft.__version__ == installed
          scripts = {
              ep.name: ep.value
              for ep in importlib.metadata.distribution("telecraft").entry_points
              if ep.group == "console_scripts"
          }
          assert scripts.get("telecraft") == "telecraft.cli:main"
          PY

      - name: Upload package distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/telecraft
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
