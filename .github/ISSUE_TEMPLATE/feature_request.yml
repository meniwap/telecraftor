name: Feature request
description: Propose a focused addition or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the API shape. Do not include real account data, session material, or private Telegram content.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What cannot be done safely or clearly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a small synthetic example when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Additive public API
        - Changes existing public behavior
        - Internal-only change
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Responsible use
      options:
        - label: This request does not enable spam, unauthorized access, credential sharing, or evasion of Telegram controls.
          required: true
