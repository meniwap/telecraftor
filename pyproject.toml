[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "telecraft"
version = "0.2.2"
description = "Async MTProto-first Telegram client library for user and bot sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [
  { name = "meniwap" },
]
keywords = [
  "telegram",
  "mtproto",
  "bot",
  "userbot",
  "asyncio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50.0.0",
]

[project.scripts]
telecraft = "telecraft.cli:main"

[project.urls]
Homepage = "https://github.com/meniwap/telecraftor"
Repository = "https://github.com/meniwap/telecraftor"
Issues = "https://github.com/meniwap/telecraftor/issues"
Documentation = "https://github.com/meniwap/telecraftor#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=7",
  "ruff>=0.5",
  "mypy>=1.10",
  "twine>=6",
  "pip-audit>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast deterministic tests",
  "live: live tests against Telegram",
  "live_prod_safe: prod-safe live smoke tests",
]

[tool.coverage.run]
branch = true
source = ["telecraft"]
omit = ["*/telecraft/tl/generated/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "src/telecraft/tl/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
exclude = "src/telecraft/tl/generated"

[tool.hatch.build]
exclude = [
  "/.cursor",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.sessions",
  "/.telecraft",
  "/.venv",
  "/build",
  "/dist",
  "/downloads",
  "/reports",
  "/.gitignore",
  "/.DS_Store",
  "/cachkl",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telecraft"]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/telecraft",
]
